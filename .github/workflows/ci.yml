name: Build and integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      MONGO_DB: ecommerce_test
      Mongo__Database: ecommerce_test
      ASPNETCORE_ENVIRONMENT: Development
      Admin__Username: admin
      Admin__Password: CI-only-password-2026
      EC_ADMIN_PASSWORD: CI-only-password-2026
      EC_BASE_URL: http://localhost:5080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements.txt
      - run: docker compose up -d --wait
      - run: python tools/init_mongo.py
      - run: python tools/generate_data.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python tools/seed.py --db ecommerce_test
      - run: python tools/seed.py --db ecommerce_test
      - run: dotnet build src/Ecommerce.Web -c Release --nologo
      - name: Start MVC app and verify
        shell: bash
        run: |
          dotnet run --project src/Ecommerce.Web -c Release --no-build --urls http://localhost:5080 > evidence/web-ci.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://localhost:5080 >/dev/null; then break; fi
            sleep 1
          done
          python tests/e2e.py
      - run: python tools/seed.py --db ecommerce_dev
      - run: python tools/transfer_data.py roundtrip --db ecommerce_dev --target compass_test --folder exports/ci
      - run: python tools/benchmark.py --source ecommerce_dev --target ci_bench --scale 50 --out evidence/benchmark-ci.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: evidence/
